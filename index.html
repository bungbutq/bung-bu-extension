<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>BUNG BU EXTENSION</title>

  <link rel="icon" type="image/png" href="./logo4.png">
  <link rel="apple-touch-icon" href="./logo4.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#355eff">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BUNG BU">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .app-frame {
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #eef2f7;
    }

    @supports not (height: 100dvh) {
      .app-frame {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="bungBuFrame"
    class="app-frame"
    src="about:blank"
    allow="clipboard-read; clipboard-write; geolocation; fullscreen"
    allowfullscreen
  ></iframe>

  <script>
    const BUNG_BU_APP_URL = "https://script.google.com/macros/s/AKfycbypGlJUjavguYjlSdpFeWfuQrPntjd2fAipQo6-2XNrjJxhzg2qTOs6GrFoSPwBGDOC/exec";

    const WRAPPER_SESSION_KEY = "bb_wrapper_logged_in_user";
    const WRAPPER_SESSION_DAYS = 7;
    const WRAPPER_SESSION_MS = WRAPPER_SESSION_DAYS * 24 * 60 * 60 * 1000;

    function isAllowedBungBuOrigin(origin) {
      try {
        const host = new URL(origin).hostname;

        return (
          host === "script.google.com" ||
          host === "script.googleusercontent.com" ||
          host.endsWith(".googleusercontent.com")
        );
      } catch (e) {
        return false;
      }
    }

    function getWrapperLoginExpiryTimestamp() {
      return Date.now() + WRAPPER_SESSION_MS;
    }

    function isWrapperSessionValid(sessionData) {
      if (!sessionData || !sessionData.user || !sessionData.expiresAt) {
        return false;
      }

      return Date.now() < Number(sessionData.expiresAt);
    }

    function saveWrapperSession(sessionData) {
      try {
        if (!sessionData || !sessionData.user) return;

        const nextSession = {
          user: sessionData.user,
          expiresAt: Number(sessionData.expiresAt || 0) > Date.now()
            ? Number(sessionData.expiresAt)
            : getWrapperLoginExpiryTimestamp(),
          updatedAt: Date.now()
        };

        localStorage.setItem(WRAPPER_SESSION_KEY, JSON.stringify(nextSession));

        console.log(
          "[WRAPPER] Đã lưu session:",
          nextSession.user && nextSession.user.employeeCode
        );
      } catch (e) {
        console.warn("[WRAPPER] Không lưu được session:", e);
      }
    }

    function loadWrapperSession() {
      try {
        const raw = localStorage.getItem(WRAPPER_SESSION_KEY);

        if (!raw) return null;

        const sessionData = JSON.parse(raw);

        if (!isWrapperSessionValid(sessionData)) {
          localStorage.removeItem(WRAPPER_SESSION_KEY);
          return null;
        }

        sessionData.expiresAt = getWrapperLoginExpiryTimestamp();
        sessionData.updatedAt = Date.now();

        localStorage.setItem(WRAPPER_SESSION_KEY, JSON.stringify(sessionData));

        return sessionData;
      } catch (e) {
        try {
          localStorage.removeItem(WRAPPER_SESSION_KEY);
        } catch (err) {}

        return null;
      }
    }

    function clearWrapperSession() {
      try {
        localStorage.removeItem(WRAPPER_SESSION_KEY);
        console.log("[WRAPPER] Đã xóa session.");
      } catch (e) {}
    }

    function encodeBase64Url(text) {
      try {
        const utf8 = encodeURIComponent(text).replace(/%([0-9A-F]{2})/g, function(match, p1) {
          return String.fromCharCode("0x" + p1);
        });

        return btoa(utf8)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      } catch (e) {
        return "";
      }
    }

    function buildFrameUrl() {
      const sessionData = loadWrapperSession();

      let url = BUNG_BU_APP_URL + "?embed=github&_t=" + Date.now();

      if (sessionData && sessionData.user) {
        const encoded = encodeBase64Url(JSON.stringify(sessionData));

        if (encoded) {
          url += "&bb_session=" + encodeURIComponent(encoded);
        }
      }

      return url;
    }

    function loadBungBuFrame() {
      const frame = document.getElementById("bungBuFrame");

      if (!frame) return;

      frame.src = buildFrameUrl();
    }

    function sendWrapperSessionToFrame() {
      const frame = document.getElementById("bungBuFrame");

      if (!frame || !frame.contentWindow) return;

      const sessionData = loadWrapperSession();

      if (!sessionData) return;

      try {
        frame.contentWindow.postMessage({
          type: "BUNG_BU_PARENT_SESSION",
          sessionData: sessionData,
          sentAt: Date.now()
        }, "*");

        console.log(
          "[WRAPPER] Đã gửi session vào iframe:",
          sessionData.user && sessionData.user.employeeCode
        );
      } catch (e) {
        console.warn("[WRAPPER] Không gửi được session vào iframe:", e);
      }
    }

    function sendWrapperSessionToFrameRepeated() {
      [0, 250, 700, 1500, 3000, 5000, 8000].forEach(function(delay) {
        setTimeout(function() {
          sendWrapperSessionToFrame();
        }, delay);
      });
    }

    async function cleanupOldServiceWorkersAndCaches() {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();

          regs.forEach(function(reg) {
            try {
              reg.unregister();
            } catch (e) {}
          });
        }
      } catch (e) {}

      try {
        if ("caches" in window) {
          const keys = await caches.keys();

          keys.forEach(function(key) {
            try {
              caches.delete(key);
            } catch (e) {}
          });
        }
      } catch (e) {}
    }

    window.addEventListener("message", function(event) {
      if (!event.data || !event.data.type) return;

      if (!isAllowedBungBuOrigin(event.origin)) {
        console.warn("[WRAPPER] Bỏ qua message từ origin:", event.origin);
        return;
      }

      if (event.data.type === "BUNG_BU_RELOAD_APP") {
        // Tắt hẳn reload từ app chính để tránh bị văng ra màn tải lại.
        console.log("[WRAPPER] Đã chặn BUNG_BU_RELOAD_APP.");
        return;
      }

      if (event.data.type === "BUNG_BU_SAVE_SESSION") {
        saveWrapperSession(event.data.sessionData);

        // Không reload iframe ở đây.
        sendWrapperSessionToFrameRepeated();

        return;
      }

      if (event.data.type === "BUNG_BU_CLEAR_SESSION") {
        clearWrapperSession();
        return;
      }

      if (event.data.type === "BUNG_BU_REQUEST_SESSION") {
        sendWrapperSessionToFrameRepeated();
        return;
      }
    });

    const frame = document.getElementById("bungBuFrame");

    if (frame) {
      frame.addEventListener("load", function() {
        sendWrapperSessionToFrameRepeated();
      });
    }

    window.addEventListener("pageshow", function() {
      sendWrapperSessionToFrameRepeated();
    });

    window.addEventListener("focus", function() {
      sendWrapperSessionToFrameRepeated();
    });

    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        sendWrapperSessionToFrameRepeated();
      }
    });

    cleanupOldServiceWorkersAndCaches().finally(function() {
      loadBungBuFrame();
    });
  </script>
</body>

</html>
