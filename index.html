<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>BUNG BU EXTENSION</title>

  <link rel="icon" type="image/png" href="./logo4.png">
  <link rel="apple-touch-icon" href="./logo4.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#355eff">
  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BUNG BU">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .app-frame {
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #eef2f7;
    }

    @supports not (height: 100dvh) {
      .app-frame {
        height: 100vh;
      }
    }

    .wrapper-loading {
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: linear-gradient(135deg, #5b3df5 0%, #2596ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #ffffff;
      font-weight: 900;
    }

    .wrapper-loading.hidden {
      display: none !important;
    }

    .wrapper-loading-box {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
    }

    .wrapper-loading-logo {
      width: 180px;
      height: 180px;
      object-fit: contain;
      display: block;
    }

    .wrapper-loading-title {
      font-size: 18px;
      line-height: 1.4;
    }

    .wrapper-loading-step {
      font-size: 14px;
      line-height: 1.4;
      opacity: .92;
    }

    .wrapper-loading-progress {
      width: 180px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .35);
      overflow: hidden;
    }

    .wrapper-loading-bar {
      width: 35%;
      height: 100%;
      border-radius: 999px;
      background: #ffffff;
      animation: wrapperLoadingMove 1s ease-in-out infinite alternate;
    }

    @keyframes wrapperLoadingMove {
      from {
        width: 25%;
      }

      to {
        width: 92%;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="bungBuFrame"
    class="app-frame"
    src="about:blank"
    allow="clipboard-read; clipboard-write; geolocation; fullscreen"
    allowfullscreen
  ></iframe>

  <div id="wrapperLoading" class="wrapper-loading hidden">
    <div class="wrapper-loading-box">
      <img
        src="./logo4.png"
        alt="BUNG BU EXTENSION"
        class="wrapper-loading-logo"
      >

      <div class="wrapper-loading-title">Đang tải lại ứng dụng</div>
      <div class="wrapper-loading-step">Đang làm mới dữ liệu...</div>

      <div class="wrapper-loading-progress">
        <div class="wrapper-loading-bar"></div>
      </div>
    </div>
  </div>

  <script>
    const BUNG_BU_APP_URL = "https://script.google.com/macros/s/AKfycbypGlJUjavguYjlSdpFeWfuQrPntjd2fAipQo6-2XNrjJxhzg2qTOs6GrFoSPwBGDOC/exec";

    const WRAPPER_SESSION_KEY = "bb_wrapper_logged_in_user";
    const WRAPPER_SESSION_DAYS = 7;
    const WRAPPER_SESSION_MS = WRAPPER_SESSION_DAYS * 24 * 60 * 60 * 1000;

    function showWrapperLoading() {
      const el = document.getElementById("wrapperLoading");
      if (el) el.classList.remove("hidden");
    }

    function hideWrapperLoading() {
      const el = document.getElementById("wrapperLoading");
      if (el) el.classList.add("hidden");
    }

    function isAllowedBungBuOrigin(origin) {
      try {
        const host = new URL(origin).hostname;

        return (
          host === "script.google.com" ||
          host === "script.googleusercontent.com" ||
          host.endsWith(".googleusercontent.com")
        );
      } catch (e) {
        return false;
      }
    }

    function getWrapperLoginExpiryTimestamp() {
      return Date.now() + WRAPPER_SESSION_MS;
    }

    function isWrapperSessionValid(sessionData) {
      if (!sessionData || !sessionData.user || !sessionData.expiresAt) return false;
      return Date.now() < Number(sessionData.expiresAt);
    }

    function saveWrapperSession(sessionData) {
      try {
        if (!sessionData || !sessionData.user) return;

        const nextSession = {
          user: sessionData.user,
          expiresAt: Number(sessionData.expiresAt || 0) > Date.now()
            ? Number(sessionData.expiresAt)
            : getWrapperLoginExpiryTimestamp(),
          updatedAt: Date.now()
        };

        localStorage.setItem(WRAPPER_SESSION_KEY, JSON.stringify(nextSession));

        console.log("[WRAPPER] Đã lưu session:", nextSession.user && nextSession.user.employeeCode);
      } catch (e) {
        console.warn("[WRAPPER] Không lưu được session:", e);
      }
    }

    function loadWrapperSession() {
      try {
        const raw = localStorage.getItem(WRAPPER_SESSION_KEY);
        if (!raw) return null;

        const sessionData = JSON.parse(raw);

        if (!isWrapperSessionValid(sessionData)) {
          localStorage.removeItem(WRAPPER_SESSION_KEY);
          return null;
        }

        sessionData.expiresAt = getWrapperLoginExpiryTimestamp();
        sessionData.updatedAt = Date.now();

        localStorage.setItem(WRAPPER_SESSION_KEY, JSON.stringify(sessionData));

        return sessionData;
      } catch (e) {
        localStorage.removeItem(WRAPPER_SESSION_KEY);
        return null;
      }
    }

    function clearWrapperSession() {
      try {
        localStorage.removeItem(WRAPPER_SESSION_KEY);
        console.log("[WRAPPER] Đã xóa session.");
      } catch (e) {}
    }

    function encodeBase64Url(text) {
      try {
        const utf8 = encodeURIComponent(text).replace(/%([0-9A-F]{2})/g, function(match, p1) {
          return String.fromCharCode("0x" + p1);
        });

        return btoa(utf8)
          .replace(/\+/g, "-")
          .replace(/\//g, "_")
          .replace(/=+$/g, "");
      } catch (e) {
        return "";
      }
    }

    function buildFrameUrl() {
      const sessionData = loadWrapperSession();

      let url = BUNG_BU_APP_URL + "?embed=github&_t=" + Date.now();

      if (sessionData && sessionData.user) {
        const encoded = encodeBase64Url(JSON.stringify(sessionData));

        if (encoded) {
          url += "&bb_session=" + encodeURIComponent(encoded);
        }
      }

      return url;
    }

    function loadBungBuFrame() {
      const frame = document.getElementById("bungBuFrame");
      if (!frame) return;
    
      showWrapperLoading();
    
      frame.src = buildFrameUrl();
    
      // Chống kẹt màn loading nếu iframe load chậm hoặc iOS không bắn event load chuẩn.
      setTimeout(function() {
        hideWrapperLoading();
      }, 8000);
    }

    function sendWrapperSessionToFrame() {
      const frame = document.getElementById("bungBuFrame");
      if (!frame || !frame.contentWindow) return;

      const sessionData = loadWrapperSession();
      if (!sessionData) return;

      try {
        frame.contentWindow.postMessage({
          type: "BUNG_BU_PARENT_SESSION",
          sessionData: sessionData,
          sentAt: Date.now()
        }, "*");

        console.log("[WRAPPER] Đã gửi session vào iframe:", sessionData.user && sessionData.user.employeeCode);
      } catch (e) {
        console.warn("[WRAPPER] Không gửi được session vào iframe:", e);
      }
    }

    function sendWrapperSessionToFrameRepeated() {
      [0, 250, 700, 1500, 3000, 5000, 8000].forEach(function(delay) {
        setTimeout(function() {
          sendWrapperSessionToFrame();
        }, delay);
      });
    }

    function reloadBungBuFrame() {
      loadBungBuFrame();
    }

    window.addEventListener("message", function(event) {
      if (!event.data || !event.data.type) return;
    
      if (!isAllowedBungBuOrigin(event.origin)) {
        console.warn("[WRAPPER] Bỏ qua message từ origin:", event.origin);
        return;
      }
    
      if (event.data.type === "BUNG_BU_RELOAD_APP") {
        reloadBungBuFrame();
        return;
      }
    
      if (event.data.type === "BUNG_BU_SAVE_SESSION") {
        saveWrapperSession(event.data.sessionData);
    
        // Quan trọng:
        // Không reload iframe tại đây để tránh vòng lặp loading vô hạn.
        sendWrapperSessionToFrameRepeated();
    
        return;
      }
    
      if (event.data.type === "BUNG_BU_CLEAR_SESSION") {
        clearWrapperSession();
        return;
      }
    
      if (event.data.type === "BUNG_BU_REQUEST_SESSION") {
        sendWrapperSessionToFrameRepeated();
        return;
      }
    });

    const frame = document.getElementById("bungBuFrame");

    if (frame) {
      frame.addEventListener("load", function() {
        setTimeout(hideWrapperLoading, 450);
        sendWrapperSessionToFrameRepeated();
      });
    
      // Fallback lần nữa cho iPhone/Android nếu load event bị lỗi.
      setTimeout(function() {
        hideWrapperLoading();
      }, 10000);
    }

    window.addEventListener("pageshow", function() {
      sendWrapperSessionToFrameRepeated();
    });

    window.addEventListener("focus", function() {
      sendWrapperSessionToFrameRepeated();
    });

    document.addEventListener("visibilitychange", function() {
      if (!document.hidden) {
        sendWrapperSessionToFrameRepeated();
      }
    });

    loadBungBuFrame();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function(e) {
        console.warn("[WRAPPER] Không đăng ký được service worker:", e);
      });
    }
  </script>
</body>

</html>
