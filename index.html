<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>BUNG BU EXTENSION</title>

  <!-- ICON / LOGO KHI GHIM RA MÀN HÌNH -->
  <link rel="icon" type="image/png" href="./logo4.png">
  <link rel="apple-touch-icon" href="./logo4.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- MÀU THANH TRÌNH DUYỆT / PWA -->
  <meta name="theme-color" content="#355eff">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- IOS ADD TO HOME SCREEN -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BUNG BU">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }

    .app-frame {
      width: 100%;
      height: 100dvh;
      border: 0;
      display: block;
      background: #eef2f7;
    }

    @supports not (height: 100dvh) {
      .app-frame {
        height: 100vh;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="bungBuFrame"
    class="app-frame"
    src="https://script.google.com/macros/s/AKfycbypGlJUjavguYjlSdpFeWfuQrPntjd2fAipQo6-2XNrjJxhzg2qTOs6GrFoSPwBGDOC/exec"
    allow="clipboard-read; clipboard-write; geolocation; fullscreen"
    allowfullscreen
  ></iframe>

  <script>
    const BUNG_BU_APP_URL = "https://script.google.com/macros/s/AKfycbypGlJUjavguYjlSdpFeWfuQrPntjd2fAipQo6-2XNrjJxhzg2qTOs6GrFoSPwBGDOC/exec";

    function reloadBungBuFrame() {
      const frame = document.getElementById("bungBuFrame");
      if (!frame) return;

      frame.src = BUNG_BU_APP_URL + "?_reload=" + Date.now();
    }

    window.addEventListener("message", function(event) {
      if (!event.data || event.data.type !== "BUNG_BU_RELOAD_APP") return;

      reloadBungBuFrame();
    });
  </script>
</body>

</html>
